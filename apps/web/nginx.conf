# gantry-web: serves the built SPA. Runs as the unprivileged nginx user on 8080 with a read-only
# root filesystem: every path nginx writes (pid, temp, logs) is under /tmp (tmpfs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Compose healthcheck and ingress probe.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Hashed build assets never change: cache hard.
    location ^~ /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
    }

    # The shell must always be revalidated so a new build is picked up.
    location = /index.html {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback. Routes are hash routes, so deep links only ever request "/".
    # /api, /auth and /hooks are routed to gantry-api by the ingress and never reach here;
    # if one does (misrouted), answer 404 rather than serving the app as JSON.
    location ~ ^/(api|auth|hooks|internal)/ {
      return 404;
    }

    # A path that names a file (a dot and an extension, or any path segment starting with a dot such as /.env or /.git/config) is a file or it is not there: never
    # the app shell with a 200. Real files in the build (favicon, manifest) are still served.
    location ~* "/\.|\.[a-z0-9]+$" {
      try_files $uri =404;
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
    }
  }
}
