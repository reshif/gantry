# Frontend browser gates (AGENTS.md F-10 to F-14): axe at 390 and 1366 in light and dark, horizontal overflow, failure-path
# interception, persona journeys and screenshot diffs. No live stack: the built app is served by `vite preview` and every
# /api call is fulfilled from fixtures (apps/web/e2e/fixtures.ts). Add the job `Frontend e2e (Chromium)` to branch protection.
name: Frontend e2e

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/domain/**"
      - "package-lock.json"
      - ".github/workflows/frontend-e2e.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fe2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Frontend e2e (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @gantry/domain
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Blocking: axe, overflow, failure paths, journeys and the canaries.
      - run: GANTRY_E2E_VISUAL=off npm run e2e -w @gantry/web
      # Not blocking yet: screenshot baselines must first be generated on this runner image (see AGENTS.md section 3).
      - run: GANTRY_E2E_VISUAL=only npm run e2e -w @gantry/web
        continue-on-error: true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/e2e/report
            apps/web/e2e/test-results
          retention-days: 7
