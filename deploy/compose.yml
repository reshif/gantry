# Gantry local platform (spec section 3). Run from anywhere:
#   deploy/secrets/generate.sh
#   export DOCKER_GID=$(stat -c %g /var/run/docker.sock)
#   docker compose -f deploy/compose.yml up -d --build
# Build contexts are the repository root; Dockerfile paths follow docs/BUILD.md.
# Images: Gantry's own are ${GANTRY_IMAGE_PREFIX}gantry-<name>:${GANTRY_VERSION} (local builds: gantry-<name>:dev; a release:
# GANTRY_IMAGE_PREFIX=ghcr.io/<owner>/ GANTRY_VERSION=1.2.3, signed in CI). Third-party images are pinned by digest.
# Production: add -f deploy/compose.prod.yml (deploy/PRODUCTION.md).
name: gantry

# ---- hardening applied to every Gantry container (spec 3.6) -------------------------------------------------------
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  user: "10001:10001"
  restart: unless-stopped

# Non-secret configuration shared by the services that talk to the database and object storage.
x-data-env: &data-env
  GANTRY_ORG_ID: ${GANTRY_ORG_ID:-acme}
  GANTRY_PUBLIC_URL: https://${GANTRY_HOSTNAME:-localhost}
  DATABASE_HOST: postgres
  DATABASE_NAME: gantry
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: gantry
  S3_ACCESS_KEY: gantry

x-http-check: &http-check
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

services:
  # ---- ingress: the only published port, bound to loopback ------------------------------------------------------
  ingress:
    <<: *hardened
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    # Caddy listens unprivileged on 8443 inside the container; the host side is 127.0.0.1:443 only.
    ports:
      - "127.0.0.1:443:8443"
      # Keycloak admin console, host loopback only (never the public site). Reach it remotely with an SSH tunnel.
      - "127.0.0.1:8081:8081"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/profiles:/etc/caddy/profiles:ro
      - caddydata:/data
    environment:
      # dev serves the Mailpit inbox at /mail; prod (the Caddyfile default) serves no development routes.
      GANTRY_INGRESS_PROFILE: ${GANTRY_INGRESS_PROFILE:-dev}
      GANTRY_HOSTNAME: ${GANTRY_HOSTNAME:-localhost}
      GANTRY_TLS: ${GANTRY_TLS:-internal}
    # Caddy writes its local CA and config under XDG_*; both are on the writable volume or tmpfs.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /config:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001
    healthcheck:
      <<: *http-check
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8079/healthz"]
    networks:
      front: {}
      # A fixed address: the API trusts X-Forwarded-For from this one peer only (GANTRY_TRUST_PROXY), not from every container on the network.
      control: { ipv4_address: 10.89.17.2 }
    depends_on:
      volume-init: { condition: service_completed_successfully }
      gantry-web: { condition: service_healthy }
      gantry-api: { condition: service_healthy }
      keycloak: { condition: service_started }
      mailpit: { condition: service_started }

  gantry-web:
    <<: *hardened
    build: { context: .., dockerfile: apps/web/Dockerfile }
    image: ${GANTRY_IMAGE_PREFIX:-}gantry-web:${GANTRY_VERSION:-dev}
    healthcheck:
      <<: *http-check
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    networks: [control]

  gantry-api:
    <<: *hardened
    build: { context: .., dockerfile: services/api/Dockerfile }
    image: ${GANTRY_IMAGE_PREFIX:-}gantry-api:${GANTRY_VERSION:-dev}
    environment:
      <<: *data-env
      OIDC_ISSUER: https://${GANTRY_HOSTNAME:-localhost}/idp/realms/gantry
      # Server-side calls reach Keycloak directly; the issuer above is what tokens carry and browsers use.
      OIDC_INTERNAL_URL: http://keycloak:8081/idp/realms/gantry
      OIDC_CLIENT_ID: gantry-web
      EDGE_URL: http://gantry-edge:8443
      GITHUB_BROKER_URL: http://gantry-github:9200
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Connection tests for chat and webhook integrations leave through the edge allow-list, like deliveries do.
      GANTRY_EGRESS_PROXY: http://gantry-edge:8444
      # Off by default: when true, the sign-in page lists every person's name, email and roles. Local development only (refused unless the public URL is localhost).
      GANTRY_AUDIT_ANCHOR_FILE: /anchors/audit-anchors.jsonl
      GANTRY_DEV_DEMO_ACCOUNTS: ${GANTRY_DEV_DEMO_ACCOUNTS:-false}
      # Off by default: the org starts empty and the first sign-in with GANTRY_BOOTSTRAP_ADMIN_EMAIL becomes Factory Admin.
      # GANTRY_DEV_SEED=true loads the legacy demo data (people, projects, repos, policies) once, for development and demos only.
      GANTRY_DEV_SEED: ${GANTRY_DEV_SEED:-false}
      GANTRY_BOOTSTRAP_ADMIN_EMAIL: ${GANTRY_BOOTSTRAP_ADMIN_EMAIL:-}
      GANTRY_ORG_NAME: ${GANTRY_ORG_NAME:-Gantry}
      # Alias of a GitHub identity provider configured in Keycloak; empty = GitHub sign-in is refused with a clear message.
      OIDC_GITHUB_IDP_ALIAS: ${OIDC_GITHUB_IDP_ALIAS:-}
      # Only the ingress (Caddy, fixed address on the control network) may state the client address; other containers cannot forge it.
      GANTRY_TRUST_PROXY: 10.89.17.2
    # The backup service writes last-backup.json and last-drill.json to this small status volume; the API only reads them (System health).
    # It never mounts the volume that holds the database dumps.
    volumes:
      - backupstatus:/backups:ro
      # Signed checkpoints of the audit chain head, on a volume the database never sees (GANTRY_AUDIT_ANCHOR_FILE).
      - auditanchors:/anchors
    secrets: [db_password, session_key, data_key, edge_token, github_token, minio_root_password, oidc_client_secret]
    depends_on:
      gantry-migrate: { condition: service_completed_successfully }
      volume-init: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    healthcheck:
      <<: *http-check
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
    networks: [control]

  gantry-worker:
    <<: *hardened
    build: { context: .., dockerfile: services/worker/Dockerfile }
    image: ${GANTRY_IMAGE_PREFIX:-}gantry-worker:${GANTRY_VERSION:-dev}
    environment:
      <<: *data-env
      EDGE_URL: http://gantry-edge:8443
      GITHUB_BROKER_URL: http://gantry-github:9200
      LAUNCHER_URL: http://gantry-launcher:9100
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Slack, Teams and webhook delivery go out through the edge allow-list (a no-credentials system caller, outside the run subnet).
      HTTPS_PROXY: http://gantry-edge:8444
    secrets: [db_password, data_key, github_token, launcher_token, minio_root_password]
    depends_on:
      gantry-migrate: { condition: service_completed_successfully }
      gantry-launcher: { condition: service_healthy }
      minio: { condition: service_healthy }
    # No HTTP port: the image's own HEALTHCHECK applies (see the worker Dockerfile).
    networks: [control, launch]

  # One-shot: applies migrations as gantry_owner and sets the app role's password, then exits.
  gantry-migrate:
    <<: *hardened
    build: { context: .., dockerfile: packages/db/Dockerfile }
    image: ${GANTRY_IMAGE_PREFIX:-}gantry-migrate:${GANTRY_VERSION:-dev}
    restart: "no"
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: gantry
    secrets: [db_password, db_owner_password]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [control]

  # The only container with the host's Docker socket. It lets through only the launcher's own calls, on resources the
  # launcher owns, and container/network/volume creates that match the runner template (services/launcher/src/sockpolicy.ts).
  gantry-sockproxy:
    <<: *hardened
    image: ${GANTRY_IMAGE_PREFIX:-}gantry-launcher:${GANTRY_VERSION:-dev}
    command: ["node", "dist/sockproxy.js"]
    # The Docker socket is group-owned by the host's docker group. Set DOCKER_GID to `stat -c %g /var/run/docker.sock`.
    group_add: ["${DOCKER_GID:-999}"]
    environment:
      SOCKPROXY_PORT: "2375"
      RUNNER_VARIANTS: ${RUNNER_VARIANTS:-base=${GANTRY_IMAGE_PREFIX:-}gantry-runner:${GANTRY_VERSION:-dev}}
      EDGE_COMPOSE_SERVICE: gantry-edge
      EDGE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-gantry}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2375/_ping').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [dockerapi]

  # The workspace profile of the same proxy, for gantry-github only: it allows the broker's never-started helper container (fixed image,
  # no network, one ws-<id> volume), its archive calls and its removal, and nothing else (sockpolicy.ts routeWorkspace). The broker
  # no longer mounts the Docker socket. deploy/ci/compose-socket.mjs fails CI if any other service does.
  gantry-sockproxy-ws:
    <<: *hardened
    image: ${GANTRY_IMAGE_PREFIX:-}gantry-launcher:${GANTRY_VERSION:-dev}
    command: ["node", "dist/sockproxy.js"]
    group_add: ["${DOCKER_GID:-999}"]
    environment:
      SOCKPROXY_PROFILE: workspace
      SOCKPROXY_PORT: "2376"
      GITHUB_HELPER_IMAGE: ${GANTRY_IMAGE_PREFIX:-}gantry-github:${GANTRY_VERSION:-dev}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2376/_ping').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [wsapi]

  gantry-launcher:
    <<: *hardened
    build: { context: .., dockerfile: services/launcher/Dockerfile }
    image: ${GANTRY_IMAGE_PREFIX:-}gantry-launcher:${GANTRY_VERSION:-dev}
    # No Docker socket here: every Docker call goes through gantry-sockproxy.
    environment:
      DOCKER_PROXY_URL: http://gantry-sockproxy:2375
      LAUNCHER_PORT: "9100"
      RUNNER_VARIANTS: ${RUNNER_VARIANTS:-base=${GANTRY_IMAGE_PREFIX:-}gantry-runner:${GANTRY_VERSION:-dev}}
      # Dedicated pool for run networks (/28 each). Keep it clear of every other network on this host. See deploy/README.md.
      RUN_SUBNET_POOL: ${RUN_SUBNET_POOL:-10.213.0.0/16}
      RUN_SUBNET_PREFIX: "28"
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-32}
      EDGE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-gantry}
      EDGE_COMPOSE_SERVICE: gantry-edge
      EDGE_URL: http://gantry-edge:8443
      RUNNER_PROXY_URL: http://gantry-edge:8444
    secrets: [launcher_token]
    healthcheck:
      <<: *http-check
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/healthz"]
    depends_on:
      gantry-sockproxy: { condition: service_healthy }
    networks: [launch, dockerapi]

  gantry-edge:
    <<: *hardened
    build: { context: .., dockerfile: services/edge/Dockerfile }
    image: ${GANTRY_IMAGE_PREFIX:-}gantry-edge:${GANTRY_VERSION:-dev}
    environment:
      GANTRY_API_URL: http://gantry-api:8000
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: gantry
      S3_ACCESS_KEY: gantry
      GANTRY_ORG_ID: ${GANTRY_ORG_ID:-acme}
      # Must match the launcher's RUN_SUBNET_POOL: a caller from this range must present its run token to the proxy.
      EDGE_RUN_SUBNET: ${RUN_SUBNET_POOL:-10.213.0.0/16}
    secrets: [data_key, edge_token, vendor_keys.json, minio_root_password]
    # The edge is shared by every run and the model gateway: bound what one run's traffic can take (the per-run caps are in proxy.ts).
    mem_limit: ${GANTRY_EDGE_MEMORY:-768m}
    pids_limit: 512
    ulimits:
      nofile: { soft: 8192, hard: 8192 }
    depends_on:
      gantry-api: { condition: service_healthy }
    healthcheck:
      <<: *http-check
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8443/healthz"]
    # Run networks are attached to this container at runtime by the launcher.
    networks: [control, egress]

  gantry-github:
    <<: *hardened
    build: { context: .., dockerfile: services/github/Dockerfile }
    image: ${GANTRY_IMAGE_PREFIX:-}gantry-github:${GANTRY_VERSION:-dev}
    # The broker seeds and reads ws-<id> volumes through the Docker API (services/github/src/workspace.ts). It holds no Docker socket (it is
    # root-equivalent, and this process parses repository data an agent controls and holds the App key): it reaches the narrow workspace
    # profile of the socket proxy instead.
    environment:
      GANTRY_API_URL: http://gantry-api:8000
      GANTRY_ORG_ID: ${GANTRY_ORG_ID:-acme}
      GITHUB_HELPER_IMAGE: ${GANTRY_IMAGE_PREFIX:-}gantry-github:${GANTRY_VERSION:-dev}
      DOCKER_PROXY_URL: http://gantry-sockproxy-ws:2376
    secrets: [data_key, github_token, github_app.pem, github_app.json]
    depends_on:
      gantry-api: { condition: service_healthy }
      gantry-sockproxy-ws: { condition: service_healthy }
    healthcheck:
      <<: *http-check
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9200/healthz"]
    networks: [control, egress, wsapi]

  # ---- pulled images --------------------------------------------------------------------------------------------
  postgres:
    image: postgres:17.12-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # uid 70 is the image's postgres user; a new pgdata volume inherits that ownership from the image.
    user: "70:70"
    environment:
      POSTGRES_USER: gantry_owner
      POSTGRES_DB: gantry
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    secrets: [db_password, db_owner_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,size=1m,uid=70,gid=70,mode=0775
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gantry_owner", "-d", "gantry"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [control]

  minio:
    # MinIO no longer publishes images; this is the community build of the same server (pgsty/minio). Set MINIO_IMAGE to use another.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: gantry
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER: "off"
      HOME: /tmp
    secrets: [minio_root_password]
    volumes:
      - objdata:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      volume-init: { condition: service_completed_successfully }
    networks: [control]

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.4.7@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007}
    restart: unless-stopped
    # start-dev rebuilds Quarkus augmentation at boot, so the root filesystem stays writable for this one container.
    # A production deployment builds an optimized image and sets read_only.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:0"
    # Secrets are read from their files inside the container at start, never passed through compose environment.
    entrypoint:
      - /bin/bash
      - -c
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        export GANTRY_OIDC_CLIENT_SECRET="$$(cat /run/secrets/oidc_client_secret)"
        exec /opt/keycloak/bin/kc.sh "$$@"
      - kc
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8081"
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME: https://${GANTRY_HOSTNAME:-localhost}/idp
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # The admin console is not served on the public site; the ingress serves it on 127.0.0.1:8081 only.
      KC_HOSTNAME_ADMIN: http://localhost:8081/idp
    secrets: [keycloak_admin_password, oidc_client_secret]
    volumes:
      # The dev H2 database lives under data/. Persisting it keeps user ids (the OIDC `sub` Gantry links people to)
      # stable across container recreation. --import-realm skips a realm that already exists, so edits to
      # realm-gantry.json only apply after `docker volume rm gantry_kcdata`.
      - kcdata:/opt/keycloak/data
      - ./keycloak/realm-gantry.json:/opt/keycloak/data/import/realm-gantry.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /idp/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [control]

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    environment:
      MP_WEBROOT: /mail
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_DATABASE: /tmp/mailpit.db
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [control]

  # Daily backups of Postgres (Gantry and Keycloak) and the object store, with a weekly restore drill (deploy/backup).
  # Locally only when asked for (--profile backup); the production profile always runs it. Sets go to the `backups`
  # volume, or to GANTRY_BACKUP_VOLUME (a host path owned by uid 10001). It joins `egress` only to copy sets off the host
  # when GANTRY_BACKUP_REMOTE and the backup_remote secret are set.
  gantry-backup:
    <<: *hardened
    profiles: [backup]
    build: { context: .., dockerfile: deploy/backup/Dockerfile }
    image: ${GANTRY_IMAGE_PREFIX:-}gantry-backup:${GANTRY_VERSION:-dev}
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: gantry
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: gantry
      S3_ACCESS_KEY: gantry
      GANTRY_VERSION: ${GANTRY_VERSION:-dev}
      GANTRY_BACKUP_AT: ${GANTRY_BACKUP_AT:-02:00}
      GANTRY_BACKUP_KEEP: ${GANTRY_BACKUP_KEEP:-7}
      GANTRY_BACKUP_DRILL: ${GANTRY_BACKUP_DRILL:-weekly}
      GANTRY_BACKUP_REMOTE: ${GANTRY_BACKUP_REMOTE:-}
    secrets: [db_owner_password, minio_root_password, backup_remote]
    volumes:
      - ${GANTRY_BACKUP_VOLUME:-backups}:/backups
      - backupstatus:/status
    healthcheck:
      # Healthy while the newest backup succeeded and is less than 26 hours old.
      test: ["CMD-SHELL", "grep -q '\"ok\":true' /status/last-backup.json && [ -n \"$$(find /status/last-backup.json -mmin -1560)\" ]"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 30m
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [control, egress]

  # One-shot: named volumes are created root-owned when the image has no such directory, so hand them to uid 10001.
  volume-init:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    command: ["sh", "-c", "chown 10001:10001 /vol/objdata /vol/caddydata /vol/backups /vol/backupstatus /vol/auditanchors"]
    volumes:
      - objdata:/vol/objdata
      - caddydata:/vol/caddydata
      - ${GANTRY_BACKUP_VOLUME:-backups}:/vol/backups
      - backupstatus:/vol/backupstatus
      - auditanchors:/vol/auditanchors
    networks: [control]

  # Build-only: `docker compose -f deploy/compose.yml build gantry-runner` produces the image the launcher starts runs from.
  # It is never started by compose; the launcher creates runner containers on demand.
  gantry-runner:
    profiles: [runner-image]
    build: { context: .., dockerfile: runner/Dockerfile }
    image: ${GANTRY_IMAGE_PREFIX:-}gantry-runner:${GANTRY_VERSION:-dev}
    networks: [control]

networks:
  front:
    driver: bridge
  control:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.89.17.0/24
  launch:
    driver: bridge
    internal: true
  # Launcher <-> socket proxy only.
  dockerapi:
    driver: bridge
    internal: true
  # Broker <-> workspace socket proxy only.
  wsapi:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  pgdata:
  objdata:
  caddydata:
  kcdata:
  backups:
  backupstatus:
  auditanchors:

secrets:
  db_password: { file: "${GANTRY_SECRETS_DIR:-./secrets}/db_password" }
  db_owner_password: { file: "${GANTRY_SECRETS_DIR:-./secrets}/db_owner_password" }
  session_key: { file: "${GANTRY_SECRETS_DIR:-./secrets}/session_key" }
  data_key: { file: "${GANTRY_SECRETS_DIR:-./secrets}/data_key" }
  edge_token: { file: "${GANTRY_SECRETS_DIR:-./secrets}/edge_token" }
