# Prometheus for the optional monitoring profile (deploy/PRODUCTION.md, "Monitoring and alerts").
# It scrapes the three Gantry services over the internal networks, where /metrics needs no token.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gantry-api
    metrics_path: /metrics
    static_configs:
      - targets: ["gantry-api:8000"]
  - job_name: gantry-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["gantry-worker:9464"]
  - job_name: gantry-launcher
    metrics_path: /metrics
    static_configs:
      - targets: ["gantry-launcher:9100"]
